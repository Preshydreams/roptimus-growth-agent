name: Roptimus Growth Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  growth-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run growth agent
        run: python agent.py
